name: Deploy Website (FTP)

# Builds apps/website as a static export and uploads it to shared hosting
# over FTP, alongside php-auth (session-based Google OAuth + email/password
# auth for PHP+MySQL shared hosting — see docs/PHP-AUTH.md). Runs on pushes
# to main that touch either, or manually.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER       the FTP host (IP address or hostname)
#   FTP_USERNAME     the FTP account username
#   FTP_PASSWORD     the FTP account password
#   FTP_SERVER_DIR   remote target directory (the site's document root)
#
# Credentials are never stored in this repo — only referenced as secrets.
# php-auth's own secrets (DB credentials, Google client secret, etc.) live
# in auth-lib/.env on the server, created manually once — see docs/PHP-AUTH.md.
#
# NEVER use rsync --delete on the full docroot without excluding auth/ and
# auth-lib/. For SSH deploys use scripts/deploy-website.sh.

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "php-auth/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        working-directory: apps/website
        run: npm ci

      - name: Build static export
        working-directory: apps/website
        run: npm run build
        env:
          # Google OAuth 2.0 Client ID — safe to bake into the client build:
          # it's only used as the "audience" the backend checks Google ID
          # tokens against, never a secret. Renders the Google Sign-In
          # button on /login when set; the button silently omits itself
          # otherwise (see GoogleSignInButton.tsx).
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "148156861979-ua974fq9iatjv2gvfneh9cga49efb0mm.apps.googleusercontent.com"
          # Hands off /login to php-auth (see docs/PHP-AUTH.md) instead of
          # calling services/backend, which isn't hosted anywhere the live
          # site can reach.
          NEXT_PUBLIC_USE_PHP_AUTH: "1"

      - name: Deploy static site over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: apps/website/out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-website.json
          # Keep php-auth paths out of publish/delete — docroot is shared with php-auth
          exclude: |
            **/.git*
            **/.git*/**
            auth/**
            auth-lib/**

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Install php-auth dependencies
        working-directory: php-auth
        run: composer install --no-dev --optimize-autoloader

      - name: Assert php-auth deploy payload
        run: |
          set -euo pipefail
          test -f php-auth/auth/login.php
          test -f php-auth/auth/register.php
          test -f php-auth/auth/google.php
          test -f php-auth/auth/google-callback.php
          test -f php-auth/auth/me.php
          test -f php-auth/auth/logout.php
          test -f php-auth/auth/chat.php
          test -f php-auth/auth/investor-inquiry.php
          test -f php-auth/auth/styles.css
          test -f php-auth/auth/_layout.php
          test -f php-auth/auth-lib/bootstrap.php
          test -f php-auth/auth-lib/src/ChatAssistant.php
          test -f php-auth/auth-lib/src/CrmLeadClient.php
          test -f php-auth/auth-lib/src/InquiryNotifier.php
          test -f php-auth/auth-lib/src/SmtpMailer.php
          test -f php-auth/auth-lib/.htaccess
          test -f php-auth/auth-lib/vendor/autoload.php
          # Never ship a real secrets file from CI
          test ! -f php-auth/auth-lib/.env

      - name: Deploy php-auth over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: php-auth/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-php-auth.json
          exclude: |
            **/.git*
            **/.git*/**
            sql/**
            composer.json
            composer.lock
            .gitignore
            .env.example
            auth-lib/.env
            auth-lib/.env.example
